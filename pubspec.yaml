name: self_study_library_manager
description: Production-ready Flutter app for self study library management using Supabase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.6
  provider: ^6.1.2
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
